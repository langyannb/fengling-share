name: Android 编译

# 编译一律在 GitHub Actions 上做, 本地不出包
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: 构建变体
        required: true
        default: auto
        type: choice
        options: [auto, release, debug]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" || \
          sdkmanager --install "platform-tools" "platforms;android-37"

      - name: 移除本地专有的 aapt2 覆盖 (Termux 专用, CI 上不存在)
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: 还原签名密钥
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/fengling.jks
            echo "has_key=true" >> "$GITHUB_OUTPUT"
            echo "签名密钥已还原"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64, 将只编译 debug 包"
          fi

      - name: 编译 Release
        if: ${{ github.event.inputs.variant != 'debug' && steps.keystore.outputs.has_key == 'true' }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: 编译 Debug
        if: ${{ github.event.inputs.variant == 'debug' || steps.keystore.outputs.has_key != 'true' }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: fengling-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 失败提示
        if: failure()
        run: |
          echo "### 编译失败" >> "$GITHUB_STEP_SUMMARY"
          echo "查看日志: gh run view ${{ github.run_id }} -R ${{ github.repository }} --log-failed" >> "$GITHUB_STEP_SUMMARY"
